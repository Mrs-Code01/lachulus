    <div class="stage__sky" aria-hidden="true"></div>

    <!--
    Hintergrundvideo: autoplay, muted, loop, playsinline — wie im Briefing.
    Rein dekorativ, daher aria-hidden und ohne Bedienelemente. Selbst gehostet,
    kein YouTube-Embed, damit kein Cookie-Banner nötig wird.

    Die Quellen stehen bewusst in data-src statt in src. Sonst holt der
    Vorablese-Scanner des Browsers die Datei, noch bevor das Skript darunter
    überhaupt läuft — und das Handy lädt erst die 2,4-MB-Desktopfassung und
    danach nochmal die 1,1-MB-Handyfassung. Auf einer langsamen Verbindung ist
    genau das der Grund, warum das Video hängt. Das Skript setzt src selbst,
    dann wird genau eine Datei geholt.

    WebM steht vor MP4: der Browser nimmt die erste Quelle, die er abspielen
    kann, und WebM ist hier rund 40 % kleiner.
  -->
    <video class="stage__video" id="bg-video" poster="assets/img/poster.jpg" autoplay muted loop playsinline
      disablepictureinpicture tabindex="-1" aria-hidden="true">
      <source id="src-webm" type="video/webm"
        data-src="assets/video/lachulus-loop.webm"
        data-src-small="assets/video/lachulus-loop-mobile.webm">
      <source id="src-mp4" type="video/mp4"
        data-src="assets/video/lachulus-loop.mp4"
        data-src-small="assets/video/lachulus-loop-mobile.mp4">
    </video>

    <!-- Ohne JavaScript bleibt oben nur das Posterbild. Inhalt von <noscript>
       wird bei aktivem JavaScript nicht als Markup gelesen, der Scanner holt
       hier also nichts — abgeschaltet spielt die Desktopfassung wie bisher. -->
    <noscript>
      <video class="stage__video" poster="assets/img/poster.jpg" autoplay muted loop playsinline
        disablepictureinpicture tabindex="-1" aria-hidden="true">
        <source src="assets/video/lachulus-loop.webm" type="video/webm">
        <source src="assets/video/lachulus-loop.mp4" type="video/mp4">
      </video>
    </noscript>

    <script>
      /*
        Läuft direkt nach dem Video-Element und hat zwei Aufgaben.

        Erstens die Quelle wählen: bei „Bewegung reduzieren" gar keine, auf
        schmalen Bildschirmen die kleinere Fassung (854 × 480 statt 1280 × 720,
        rund ein Drittel der Bytes), sonst die grosse.

        Zweitens das Abspielen bewachen. Ein Hintergrundvideo, das nicht läuft,
        fällt sofort auf — und Autoplay scheitert in der Praxis aus mehreren
        Gründen, die alle nichts miteinander zu tun haben:

          - iOS im Stromsparmodus sperrt Autoplay grundsätzlich. Kein Attribut
            hilft dagegen; erst eine Berührung der Seite hebt die Sperre auf.
          - Safari pausiert das Video, wenn der Tab in den Hintergrund geht
            oder das Gerät sperrt, und startet von allein nicht wieder.
          - Safari ab iOS 17.4 meldet VP9/WebM als abspielbar, liefert aber
            nicht auf jedem Gerät ein Bild. Dann muss das MP4 einspringen.
          - Auf schlechter Verbindung bleibt der Puffer stehen („stalled").
      */
      (function () {
        var stage = document.querySelector('.stage');
        var video = document.getElementById('bg-video');
        var webm = document.getElementById('src-webm');
        var mp4 = document.getElementById('src-mp4');
        if (!video || !webm || !mp4 || !window.matchMedia) return;

        /* Bewegung reduzieren: die Quellen fliegen raus, bevor sie je ein src
           bekommen — es wird also kein einziges Byte Video geladen. */
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          webm.remove();
          mp4.remove();
          video.removeAttribute('autoplay');
          return;
        }

        var small = matchMedia('(max-width: 820px)').matches;
        function pick(el) {
          return (small && el.getAttribute('data-src-small')) || el.getAttribute('data-src');
        }

        /* Safari übernimmt das muted-Attribut nach einem load() nicht
           zuverlässig — und ohne muted verweigert jeder Browser das Autoplay. */
        video.muted = true;
        video.defaultMuted = true;

        function attempt() {
          if (!video.paused) return;
          var p = video.play();
          /* Abgelehnte Zusage abfangen, sonst schreibt die Konsole bei jedem
             gesperrten Autoplay einen unbehandelten Fehler. */
          if (p && p.catch) p.catch(function () { });
        }

        /* Läuft das Video, ist die Farbfläche darunter vollständig verdeckt.
           Die Klasse hält deren Animation an — das spart auf schwacher
           Hardware den gesamten Aufwand für etwas Unsichtbares. */
        video.addEventListener('playing', function () {
          if (stage) stage.classList.add('is-playing');
        });
        ['error', 'emptied'].forEach(function (ev) {
          video.addEventListener(ev, function () {
            if (stage) stage.classList.remove('is-playing');
          });
        });

        /* Sobald genug Daten da sind — Safari startet sonst gelegentlich nicht,
           obwohl autoplay im Markup steht. */
        ['loadedmetadata', 'loadeddata', 'canplay'].forEach(function (ev) {
          video.addEventListener(ev, attempt);
        });

        /* Rückkehr aus Hintergrund, Sperrbildschirm oder Vor-/Zurück-Cache. */
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) attempt();
        });
        window.addEventListener('pageshow', attempt);

        /* Einmalig vom WebM auf das MP4 wechseln. */
        var switched = false;
        function fallbackToMp4() {
          if (switched) return;
          switched = true;
          if (webm.parentNode) webm.remove();
          video.load();
          attempt();
        }

        /* Stockender Puffer: höchstens zwei neue Anläufe, danach bleibt das
           Posterbild stehen statt endlos nachzuladen. */
        var retries = 0;
        function recover() {
          if (retries++ > 1) return;
          video.load();
          attempt();
        }
        video.addEventListener('stalled', recover);

        /* Fehler einer <source> erreichen das Video nur in der Erfassungsphase,
           deshalb capture = true. */
        video.addEventListener('error', function () {
          if (switched) recover(); else fallbackToMp4();
        }, true);

        /* Wächter: wer nach sechs Sekunden noch kein einziges Bild dekodiert
           hat, bekommt das MP4. */
        setTimeout(function () {
          if (video.readyState < 2) { if (switched) attempt(); else fallbackToMp4(); }
        }, 6000);

        /* Letzte Rettung für den iOS-Stromsparmodus: die erste Berührung der
           Seite gibt das Abspielen frei. Einmalig und passiv, damit die Geste
           selbst nicht ausgebremst wird. */
        var once = { once: true, passive: true };
        ['touchstart', 'pointerdown', 'keydown'].forEach(function (ev) {
          document.addEventListener(ev, attempt, once);
        });

        function start(useWebm) {
          if (useWebm) {
            webm.src = pick(webm);
          } else {
            switched = true;
            webm.remove();
          }
          mp4.src = pick(mp4);
          video.load();
          attempt();
        }

        /*
          VP9 lohnt sich nur dort, wo die Grafikeinheit es selbst dekodiert.
          iPhones haben keinen VP9-Decoder in Hardware: Safari meldet die Datei
          zwar als abspielbar, rechnet sie dann aber auf der CPU — daher das
          Ruckeln und der heisse Akku. mediaCapabilities beantwortet genau
          diese Frage: powerEfficient sagt, ob in Hardware dekodiert wird,
          smooth, ob es die Bildrate hält.

          Ist die Abfrage nicht vorhanden oder unsicher, gewinnt H.264. Das
          dekodiert praktisch jedes Gerät seit Jahren in Hardware — 250 kB
          mehr auf dem Handy sind der Preis für ein Video, das nicht stockt.
        */
        var mc = navigator.mediaCapabilities;
        if (mc && mc.decodingInfo) {
          mc.decodingInfo({
            type: 'file',
            video: {
              contentType: small ? 'video/webm; codecs="vp09.00.30.08"'
                                 : 'video/webm; codecs="vp09.00.31.08"',
              width: small ? 854 : 1280,
              height: small ? 480 : 720,
              bitrate: small ? 440000 : 1000000,
              framerate: 24
            }
          }).then(function (info) {
            start(!!(info && info.supported && info.smooth && info.powerEfficient));
          }, function () {
            start(false);
          });
        } else {
          start(false);
        }
      })();
    </script>
