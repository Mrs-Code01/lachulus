    <div class="stage__sky" aria-hidden="true"></div>

    <!--
    Hintergrundvideo: autoplay, muted, loop, playsinline — wie im Briefing.
    Rein dekorativ, daher aria-hidden und ohne Bedienelemente. Selbst gehostet,
    kein YouTube-Embed, damit kein Cookie-Banner nötig wird.

    Nur noch H.264/MP4, kein WebM mehr. Gemessen wurde beides gegen dieselbe
    nahezu verlustfreie Vorlage: auf gleicher Qualitätsstufe (SSIM 0,9927) ist
    das MP4 4,0 MB gross, das VP9-WebM dagegen 5,1 MB. Bei der jetzt gefahrenen
    Schärfe kostet WebM also Bytes, statt welche zu sparen — und H.264 wird
    zusätzlich auf jedem Gerät in Hardware dekodiert, auch auf dem iPhone.

    Die Quellen stehen bewusst in data-src statt in src. Sonst holt der
    Vorablese-Scanner des Browsers die Datei, noch bevor das Skript darunter
    überhaupt läuft — und das Handy lädt erst die grosse und danach nochmal die
    kleine Fassung. Das Skript setzt src selbst, dann wird genau eine Datei
    geholt.

    Neue Dateinamen (-v2): Videos werden laut .htaccess ein Jahr lang
    zwischengespeichert. Ohne neuen Namen bekämen wiederkehrende Besucher
    weiterhin die alte, unschärfere Fassung.
  -->
    <video class="stage__video" id="bg-video" poster="assets/img/poster-v2.jpg" autoplay muted loop playsinline
      disablepictureinpicture tabindex="-1" aria-hidden="true">
      <source id="src-mp4" type="video/mp4"
        data-src="assets/video/lachulus-loop-v2.mp4"
        data-src-small="assets/video/lachulus-loop-mobile-v2.mp4">
    </video>

    <!-- Ohne JavaScript bleibt oben nur das Posterbild. Inhalt von <noscript>
       wird bei aktivem JavaScript nicht als Markup gelesen, der Scanner holt
       hier also nichts — abgeschaltet spielt die Desktopfassung wie bisher. -->
    <noscript>
      <video class="stage__video" poster="assets/img/poster-v2.jpg" autoplay muted loop playsinline
        disablepictureinpicture tabindex="-1" aria-hidden="true">
        <source src="assets/video/lachulus-loop-v2.mp4" type="video/mp4">
      </video>
    </noscript>

    <script>
      /*
        Läuft direkt nach dem Video-Element und hat zwei Aufgaben.

        Erstens die Quelle wählen: bei „Bewegung reduzieren" gar keine, auf
        schmalen Bildschirmen die kleinere Fassung, sonst die grosse. Beide
        sind 1280 × 720 — auf dem Handy wird das Bild durch object-fit: cover
        stark hochskaliert, eine 854 × 480-Fassung war dort sichtbar weich.
        Unterschiedlich ist nur die Datenrate.

        Zweitens das Abspielen bewachen. Ein Hintergrundvideo, das nicht läuft,
        fällt sofort auf — und Autoplay scheitert in der Praxis aus mehreren
        Gründen, die alle nichts miteinander zu tun haben:

          - iOS im Stromsparmodus sperrt Autoplay grundsätzlich. Kein Attribut
            hilft dagegen; erst eine Berührung der Seite hebt die Sperre auf.
          - Safari pausiert das Video, wenn der Tab in den Hintergrund geht
            oder das Gerät sperrt, und startet von allein nicht wieder.
          - Auf schlechter Verbindung bleibt der Puffer stehen („stalled").
      */
      (function () {
        var stage = document.querySelector('.stage');
        var video = document.getElementById('bg-video');
        var mp4 = document.getElementById('src-mp4');
        if (!video || !mp4 || !window.matchMedia) return;

        /* Bewegung reduzieren: die Quelle fliegt raus, bevor sie je ein src
           bekommt — es wird also kein einziges Byte Video geladen. */
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          mp4.remove();
          video.removeAttribute('autoplay');
          return;
        }

        var small = matchMedia('(max-width: 820px)').matches;

        /* Safari übernimmt das muted-Attribut nach einem load() nicht
           zuverlässig — und ohne muted verweigert jeder Browser das Autoplay. */
        video.muted = true;
        video.defaultMuted = true;

        function attempt() {
          if (!video.paused) return;
          var p = video.play();
          /* Abgelehnte Zusage abfangen, sonst schreibt die Konsole bei jedem
             gesperrten Autoplay einen unbehandelten Fehler. */
          if (p && p.catch) p.catch(function () { });
        }

        /* Läuft das Video, ist die Farbfläche darunter vollständig verdeckt.
           Die Klasse hält deren Animation an und startet den Wechsel zwischen
           heller und abgedunkelter Phase. */
        video.addEventListener('playing', function () {
          if (stage) stage.classList.add('is-playing');
        });
        ['error', 'emptied'].forEach(function (ev) {
          video.addEventListener(ev, function () {
            if (stage) stage.classList.remove('is-playing');
          });
        });

        /* Sobald genug Daten da sind — Safari startet sonst gelegentlich nicht,
           obwohl autoplay im Markup steht. */
        ['loadedmetadata', 'loadeddata', 'canplay'].forEach(function (ev) {
          video.addEventListener(ev, attempt);
        });

        /* Rückkehr aus Hintergrund, Sperrbildschirm oder Vor-/Zurück-Cache. */
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) attempt();
        });
        window.addEventListener('pageshow', attempt);

        /* Stockender Puffer: höchstens zwei neue Anläufe, danach bleibt das
           Posterbild stehen statt endlos nachzuladen. */
        var retries = 0;
        function recover() {
          if (retries++ > 1) return;
          video.load();
          attempt();
        }
        video.addEventListener('stalled', recover);
        video.addEventListener('error', recover, true);

        /* Wächter: wer nach acht Sekunden noch kein einziges Bild dekodiert
           hat, bekommt einen neuen Anlauf. Grosszügiger als früher, weil die
           Datei jetzt schärfer und damit grösser ist. */
        setTimeout(function () {
          if (video.readyState < 2) recover(); else attempt();
        }, 8000);

        /* Letzte Rettung für den iOS-Stromsparmodus: die erste Berührung der
           Seite gibt das Abspielen frei. Einmalig und passiv, damit die Geste
           selbst nicht ausgebremst wird. */
        var once = { once: true, passive: true };
        ['touchstart', 'pointerdown', 'keydown'].forEach(function (ev) {
          document.addEventListener(ev, attempt, once);
        });

        mp4.src = small ? mp4.getAttribute('data-src-small') : mp4.getAttribute('data-src');
        video.load();
        attempt();
      })();
    </script>
