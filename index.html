    <!-- Rückfallebene aus dem Entwurf. Immer da, auch ohne Video. -->
    <div class="stage__sky" aria-hidden="true"></div>

    <!--
    Hintergrundvideo: muted, loop, playsinline — wie im Briefing. Rein
    dekorativ, daher aria-hidden und ohne Bedienelemente. Selbst gehostet,
    kein YouTube-Embed, damit kein Cookie-Banner nötig wird.

    KEIN autoplay-Attribut, und das ist Absicht. Mit autoplay startet der
    Browser, sobald er ein paar Sekunden im Puffer hat. Reicht die Leitung
    dann nicht, läuft die Wiedergabe dem Puffer davon und das Video stockt —
    gemessen: 2,7 Mbit/s Datenrate gegen 1–3,5 Mbit/s Leitung, das Video war
    nach 18,9 s geladen und dauert 20 s. Genau daher kam das Ruckeln.

    Stattdessen startet das Skript unten erst, wenn die Datei durchgehend
    gepuffert ist. Bis dahin steht das Posterbild — das ist das erste Bild der
    Schleife, der Übergang ist also unsichtbar. Danach läuft die Schleife aus
    dem Cache und kann gar nicht mehr stocken.

    Die Quellen stehen in data-src statt src, damit der Vorablese-Scanner des
    Browsers nicht schon die grosse Fassung holt, bevor das Skript die
    passende auswählen konnte.

    Neue Dateinamen (-v3): Videos werden dauerhaft zwischengespeichert
    (vercel.json). Ohne neuen Namen bekämen wiederkehrende Besucher die alte
    Fassung.
  -->
    <video class="stage__video" id="bg-video" poster="assets/img/poster-v2.jpg" muted loop playsinline preload="auto"
      disablepictureinpicture tabindex="-1" aria-hidden="true">
      <source id="src-mp4" type="video/mp4" data-src="assets/video/lachulus-loop-v3.mp4"
        data-src-small="assets/video/lachulus-loop-mobile-v3.mp4">
    </video>

    <!-- Ohne JavaScript bleibt oben nur das Posterbild. Inhalt von <noscript>
       wird bei aktivem JavaScript nicht als Markup gelesen, der Scanner holt
       hier also nichts — abgeschaltet spielt die Desktopfassung wie bisher. -->
    <noscript>
      <video class="stage__video" poster="assets/img/poster-v2.jpg" autoplay muted loop playsinline
        disablepictureinpicture tabindex="-1" aria-hidden="true">
        <source src="assets/video/lachulus-loop-v3.mp4" type="video/mp4">
      </video>
    </noscript>

    <script>
      /*
        Wählt die Quelle und startet die Wiedergabe — aber erst dann, wenn sie
        garantiert durchläuft.

        Warum so umständlich: ein Hintergrundvideo, das mitten in der Schleife
        nachlädt, fällt sofort als Ruckeln auf. Der Browser startet von sich
        aus, sobald „genug" im Puffer ist, und schätzt dabei die Leitung
        optimistisch ein. Auf einer schwankenden Verbindung geht das schief.

        Deshalb: erst laden, dann starten. Sobald die Datei einmal vollständig
        da ist, läuft die Schleife aus dem Cache — ab da ist Stocken technisch
        ausgeschlossen.

        Dazu die üblichen Fallstricke beim Autoplay:
          - iOS im Stromsparmodus sperrt es grundsätzlich; erst eine Berührung
            der Seite hebt die Sperre auf.
          - Safari pausiert beim Wechsel in den Hintergrund und startet von
            allein nicht wieder.
      */
      (function () {
        var stage = document.querySelector('.stage');
        var video = document.getElementById('bg-video');
        var mp4 = document.getElementById('src-mp4');
        if (!video || !mp4 || !window.matchMedia) return;

        /* Bewegung reduzieren: die Quelle fliegt raus, bevor sie je ein src
           bekommt — es wird also kein einziges Byte Video geladen. */
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          mp4.remove();
          return;
        }

        var small = matchMedia('(max-width: 820px)').matches;
        var url = small ? mp4.getAttribute('data-src-small') : mp4.getAttribute('data-src');
        mp4.remove();

        /* Safari übernimmt das muted-Attribut nach einem load() nicht
           zuverlässig — und ohne muted verweigert jeder Browser das Abspielen
           ohne Nutzergeste. */
        video.muted = true;
        video.defaultMuted = true;

        var started = false;

        function play() {
          if (!video.paused) return;
          var p = video.play();
          /* Abgelehnte Zusage abfangen, sonst schreibt die Konsole bei jedem
             gesperrten Autoplay einen unbehandelten Fehler. */
          if (p && p.catch) p.catch(function () { });
        }

        function begin() {
          if (started) return;
          started = true;
          play();
        }

        /* Die Datei wird komplett geladen und erst dann abgespielt.

           Der naheliegende Weg — src setzen, autoplay, den Browser puffern
           lassen — geht hier schief, gleich zweimal:

           1. Mit autoplay startet der Browser, sobald er „genug" im Puffer
              wähnt. Auf einer schwankenden Leitung läuft die Wiedergabe dem
              Puffer davon, und das Video stockt. Genau das war der Fehler.
           2. Einfach auf einen vollen Puffer zu warten, hilft nicht: Browser
              brechen das Vorausladen bei einem Video, das nicht läuft,
              bewusst ab. Gemessen war die Datei auch nach 40 Sekunden auf
              einer 3-Mbit-Leitung nie vollständig gepuffert.

           Deshalb wird die Datei per fetch() am Stück geholt und als Blob an
           das Video gegeben. Ab dann liegt sie vollständig im Speicher — die
           Wiedergabe kann technisch nicht mehr nachladen und damit auch nicht
           mehr ruckeln. Bis dahin steht das Posterbild, und das ist das erste
           Bild der Schleife: der Übergang ist unsichtbar.

           Der Browser-Cache greift dabei normal, und weil vercel.json die
           Videos unbefristet zwischenspeichern lässt, fällt der Ladevorgang
           beim zweiten Besuch ganz weg. */
        function playFromMemory() {
          if (!window.fetch || !window.URL || !URL.createObjectURL) return playDirect();
          fetch(url, { credentials: 'same-origin' })
            .then(function (r) {
              if (!r.ok) throw new Error(r.status);
              return r.blob();
            })
            .then(function (blob) {
              video.src = URL.createObjectURL(blob);
              video.load();
              begin();
            })
            .catch(playDirect);
        }

        /* Rückfallebene, falls fetch scheitert: dann eben direkt — lieber ein
           Video, das eventuell nachlädt, als gar keines. */
        var fellBack = false;
        function playDirect() {
          if (fellBack) return;
          fellBack = true;
          video.src = url;
          video.load();
          video.addEventListener('canplay', begin);
          begin();
        }

        ['loadeddata', 'canplay', 'canplaythrough'].forEach(function (ev) {
          video.addEventListener(ev, function () { if (started) play(); });
        });

        /* Läuft das Video, ist die Farbfläche darunter vollständig verdeckt.
           Die Klasse hält deren Animation an und startet den Wechsel zwischen
           heller und abgedunkelter Phase. */
        video.addEventListener('playing', function () {
          if (stage) stage.classList.add('is-playing');
        });
        video.addEventListener('emptied', function () {
          if (stage) stage.classList.remove('is-playing');
        });

        /* Rückkehr aus Hintergrund, Sperrbildschirm oder Vor-/Zurück-Cache:
           nur weiterlaufen lassen, was schon einmal gestartet war. */
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden && started) play();
        });
        window.addEventListener('pageshow', function () { if (started) play(); });

        /* Letzte Rettung für den iOS-Stromsparmodus: die erste Berührung der
           Seite gibt das Abspielen frei. Einmalig und passiv, damit die Geste
           selbst nicht ausgebremst wird. */
        var once = { once: true, passive: true };
        ['touchstart', 'pointerdown', 'keydown'].forEach(function (ev) {
          document.addEventListener(ev, function () { if (started) play(); }, once);
        });

        playFromMemory();
      })();
    </script>
